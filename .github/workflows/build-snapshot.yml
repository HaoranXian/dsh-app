name: Build dsh Android snapshot

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH npm 版本（默认 latest）'
        required: false
        default: 'latest'
  push:
    tags: ['v*']

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build snapshot
        env:
          DSH_VERSION: ${{ inputs.dsh_version || 'latest' }}
        run: bash dsh-android/scripts/build-snapshot.sh

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-snapshot
          path: |
            dsh-android/build/snapshot.tar.xz
            dsh-android/build/manifest.json
          if-no-files-found: error

      - name: Upload build log for failure debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-run-log
          path: dsh-android/build/snapshot-work/ci-run.log
          if-no-files-found: ignore

      - name: Report failure as issue (debug)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=dsh-android/build/snapshot-work/ci-run.log
          if [ -f "$LOG" ]; then
            python3 - "$LOG" <<'PY'
import json, os, sys, urllib.request
log = open(sys.argv[1]).read()
body = log[-8000:]
data = json.dumps({'title': '[CI] dsh snapshot build failed', 'body': body}).encode()
req = urllib.request.Request(
    'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues',
    data=data, method='POST',
    headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
try:
    urllib.request.urlopen(req)
except Exception as e:
    print('issue create failed:', e)
PY
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-android/build/snapshot.tar.xz
            dsh-android/build/manifest.json
          generate_release_notes: true
